  <div data-include="partials/nav.html"></div>

  <main>
    <section class="work-projects container">
      <div class="work-projects__grid">
        <article class="work-card" data-animate>
          <a class="work-card__media" href="https://www.jensai.fi" target="_blank" rel="noopener" aria-label="View the Jensai Skin & Wellness project">
            <img class="work-card__img" src="assets/jensai-hero.webp" alt="Jensai Skin & Wellness -kauneushoitolan sisätila Espoossa" loading="lazy">
          </a>
          <div class="work-card__meta">
            <h3 class="work-card__name" data-i18n="pages.work.projects.jensai.name">Jensai Skin & Wellness</h3>
            <p class="work-card__descriptor" data-i18n="pages.work.projects.jensai.descriptor">Website design & development for a premium skincare & beauty salon in Espoo.</p>
            <a class="work-card__link" href="https://www.jensai.fi" target="_blank" rel="noopener" data-i18n="pages.work.viewProject">View project</a>
          </div>
        </article>

        <article class="work-card" data-animate>
          <a class="work-card__media" href="https://tatuata.com" target="_blank" rel="noopener" aria-label="View the Tatuata project">

          </a>
          <div class="work-card__meta">
            <h3 class="work-card__name" data-i18n="pages.work.projects.tatuata.name">Tatuata</h3>
            <p class="work-card__descriptor" data-i18n="pages.work.projects.tatuata.descriptor">Website design & development for one of Helsinki's finest tattoo studios.</p>
            <a class="work-card__link" href="https://tatuata.com" target="_blank" rel="noopener" data-i18n="pages.work.viewProject">View project</a>
          </div>
        </article>
      </div>
